# Orchestrator — local reusable stages, PR-gated builds, one aggregate check `ci`.
# Scoped to test/lint/build: no smoke or release stages are wired in this repo.
# Rationale: github-actions-align/templates/README.md#ciserviceyaml
name: CI

# push only, no pull_request — branch-push checks surface on the PR anyway, and
# adding pull_request would double-run every same-repo PR.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Does not cancel a RUNNING main job. A third main push can still cancel the
  # one sitting pending — GitHub allows only one pending run per group.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Decides whether this push warrants building an image. Code testing always
  # runs; building does not — most feature-branch commits are WIP, and a
  # multi-arch build is the bulk of the runner time and registry churn.
  # A DRAFT PR counts.
  context:
    name: context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.q.outputs.build }}
    steps:
      - id: q
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "main or manual dispatch -> build"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" \
                --state open --json number --jq 'length')
          if [ "${n}" -gt 0 ]; then
            echo "${n} open PR(s) for ${GITHUB_REF_NAME} -> build"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "no open PR for ${GITHUB_REF_NAME} -> test only (open a draft PR to get an image)"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    uses: ./.github/workflows/ci-test.yml

  # No App secrets: ci-build falls back to GITHUB_TOKEN. GHCR refuses App
  # installation tokens for packages owned by a personal account ("installation
  # not allowed to Write organization package"); GITHUB_TOKEN can push.
  build:
    needs: [context, test]
    if: ${{ needs.context.outputs.build == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-build.yml

  # The single aggregate check.
  ci:
    # `context` MUST be here. Without it, a failing context skips build, this
    # gate accepts `skipped`, and the check goes GREEN on a PR whose image was
    # never built.
    needs: [context, test, build]
    if: ${{ !cancelled() }}   # required: else this is SKIPPED on failure, which can satisfy protection
    runs-on: ubuntu-latest
    steps:
      - name: Assert required stages
        env:
          CONTEXT: ${{ needs.context.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          fail=0
          for stage in context:"${CONTEXT}" test:"${TEST}"; do
            name="${stage%%:*}"; result="${stage##*:}"
            printf '%-8s %s (must be success)\n' "${name}" "${result}"
            [ "${result}" = "success" ] || fail=1
          done
          # build skips legitimately when context says "no open PR" — and context
          # is asserted successful above, so a skip here is a real decision rather
          # than an upstream failure leaking through.
          printf '%-8s %s (success, or skipped when no PR is open)\n' "build" "${BUILD}"
          case "${BUILD}" in success|skipped) ;; *) fail=1 ;; esac
          [ "${fail}" = "0" ] || { echo "::error::one or more required stages did not pass"; exit 1; }
