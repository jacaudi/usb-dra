---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rtlsdr-dra
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rtlsdr-dra
rules:
  # The resourceslice controller publishes and prunes this node's pool.
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Needed to resolve the node UID used as the owner reference on slices, so they
  # are garbage-collected when the node goes away.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rtlsdr-dra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rtlsdr-dra
subjects:
  - kind: ServiceAccount
    name: rtlsdr-dra
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rtlsdr-dra
  namespace: kube-system
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: rtlsdr-dra }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rtlsdr-dra }
    spec:
      serviceAccountName: rtlsdr-dra
      priorityClassName: system-node-critical
      # Runs on every node on purpose. A node with no dongles publishes an EMPTY
      # pool, which tells the scheduler "driver healthy, no radios" — different
      # from "no pool", and it avoids leaving a stale slice behind when the last
      # dongle is unplugged.
      tolerations:
        - operator: Exists
      containers:
        - name: plugin
          image: ghcr.io/jacaudi/rtlsdr-dra:v0.1.0
          args:
            - --driver-name=sdr.jacaudi.dev
            - --rescan-interval=30s
            - -v=2
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          securityContext:
            privileged: true # writes kubelet plugin sockets and CDI specs
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: plugins
              mountPath: /var/lib/kubelet/plugins
            - name: cdi
              mountPath: /var/run/cdi
            - name: sys
              mountPath: /sys
              readOnly: true
      volumes:
        - name: plugins-registry
          hostPath: { path: /var/lib/kubelet/plugins_registry, type: Directory }
        - name: plugins
          hostPath: { path: /var/lib/kubelet/plugins, type: Directory }
        - name: cdi
          hostPath: { path: /var/run/cdi, type: DirectoryOrCreate }
        - name: sys
          hostPath: { path: /sys, type: Directory }
