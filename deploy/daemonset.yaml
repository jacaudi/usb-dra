apiVersion: v1
kind: ServiceAccount
metadata:
  name: usb-dra
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: usb-dra
rules:
  # The resourceslice controller publishes and prunes this node's pool.
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceslices
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # The kubeletplugin helper fetches the claim itself before calling
  # NodePrepareResources; without this, prepare fails with a forbidden error and the
  # pod stays in ContainerCreating.
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceclaims
    verbs:
      - get
      - list
      - watch
  # Needed to resolve the node UID used as the owner reference on slices, so they
  # are garbage-collected when the node goes away.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: usb-dra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: usb-dra
subjects:
  - kind: ServiceAccount
    name: usb-dra
    namespace: kube-system
---
# RBAC cannot scope resourceslices by node, so this policy does: the driver may write
# only its own node's usb.jacaudi.dev slices. The node comes from the pod-bound token,
# so root on one node cannot forge, rewrite or delete another node's pool or another
# driver's slices. Rename the service account or namespace above and this must follow.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: usb-dra-resourceslices
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - resource.k8s.io
        apiVersions:
          - "*"
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - resourceslices
  matchConditions:
    - name: usb-dra-service-account
      expression: request.userInfo.username == "system:serviceaccount:kube-system:usb-dra"
  variables:
    - name: userNodeName
      expression: request.userInfo.extra[?'authentication.kubernetes.io/node-name'][0].orValue('')
    # UPDATE checks the old and new slice; DELETE has only oldObject.
    - name: slices
      expression: "[object, oldObject].filter(s, s != null)"
  validations:
    - expression: variables.userNodeName != ''
      message: the usb-dra service account token is not bound to a node
    - expression: variables.slices.all(s, s.spec.?nodeName.orValue('') == variables.userNodeName)
      messageExpression: '"usb-dra on node " + variables.userNodeName + " may only write ResourceSlices for that node"'
    - expression: variables.slices.all(s, s.spec.driver == 'usb.jacaudi.dev')
      message: usb-dra may only write ResourceSlices for driver usb.jacaudi.dev
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: usb-dra-resourceslices
spec:
  policyName: usb-dra-resourceslices
  validationActions:
    - Deny
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: usb-dra
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: usb-dra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: usb-dra
    spec:
      serviceAccountName: usb-dra
      priorityClassName: system-node-critical
      # Runs on every node on purpose: a node with no USB devices publishes an empty pool, meaning the driver is healthy, and no stale slice outlives the last device.
      tolerations:
        - operator: Exists
      containers:
        - name: plugin
          image: ghcr.io/jacaudi/usb-dra:latest
          args:
            - --driver-name=usb.jacaudi.dev
            - --rescan-interval=30s
            - --exclude-classes=03,08,e0
            - -v=2
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            # Must be root: the plugin socket under /var/lib/kubelet/plugins and the
            # CDI specs under /var/run/cdi are root-owned on the host. privileged
            # alone does not change the UID.
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: plugins
              mountPath: /var/lib/kubelet/plugins
            - name: cdi
              mountPath: /var/run/cdi
            - name: sys
              mountPath: /sys
              readOnly: true
      volumes:
        - name: plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: plugins
          hostPath:
            path: /var/lib/kubelet/plugins
            type: Directory
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: sys
          hostPath:
            path: /sys
            type: Directory
