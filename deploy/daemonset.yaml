apiVersion: v1
kind: ServiceAccount
metadata:
  name: usb-dra
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: usb-dra
rules:
  # The resourceslice controller publishes and prunes this node's pool.
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceslices
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # The kubeletplugin helper fetches the claim itself before calling
  # NodePrepareResources; without this, prepare fails with a forbidden error and the
  # pod stays in ContainerCreating.
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceclaims
    verbs:
      - get
      - list
      - watch
  # Needed to resolve the node UID used as the owner reference on slices, so they
  # are garbage-collected when the node goes away.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: usb-dra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: usb-dra
subjects:
  - kind: ServiceAccount
    name: usb-dra
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: usb-dra
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: usb-dra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: usb-dra
    spec:
      serviceAccountName: usb-dra
      priorityClassName: system-node-critical
      # Runs on every node on purpose. A node with no dongles publishes an EMPTY
      # pool, which tells the scheduler "driver healthy, no radios" — different
      # from "no pool", and it avoids leaving a stale slice behind when the last
      # dongle is unplugged.
      tolerations:
        - operator: Exists
      containers:
        - name: plugin
          image: ghcr.io/jacaudi/usb-dra:latest
          args:
            - --driver-name=usb.jacaudi.dev
            - --rescan-interval=30s
            - --exclude-classes=03,08,e0
            - -v=2
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            # Must be root: the plugin socket under /var/lib/kubelet/plugins and the
            # CDI specs under /var/run/cdi are root-owned on the host. privileged
            # alone does not change the UID.
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: plugins
              mountPath: /var/lib/kubelet/plugins
            - name: cdi
              mountPath: /var/run/cdi
            - name: sys
              mountPath: /sys
              readOnly: true
      volumes:
        - name: plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: plugins
          hostPath:
            path: /var/lib/kubelet/plugins
            type: Directory
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: sys
          hostPath:
            path: /sys
            type: Directory
