# Example claim templates: any RTL-SDR, one RTL-SDR pinned by its unique serial, and the RAK4631 pinned by USB port.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: rtl-sdr-any
  namespace: selfhosted
spec:
  spec:
    devices:
      requests:
        - name: radio
          exactly:
            deviceClassName: rtl-sdr.usb.jacaudi.dev
            allocationMode: ExactCount
            count: 1
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: rtl-sdr-35650102
  namespace: selfhosted
spec:
  spec:
    devices:
      requests:
        - name: radio
          exactly:
            deviceClassName: rtl-sdr.usb.jacaudi.dev
            allocationMode: ExactCount
            count: 1
            selectors:
              - cel:
                  expression: >-
                    device.attributes["usb.jacaudi.dev"].identity == "serial" &&
                    device.attributes["usb.jacaudi.dev"].serial == "35650102"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: rak4631-lora-port
  namespace: selfhosted
spec:
  spec:
    devices:
      requests:
        - name: lora
          exactly:
            deviceClassName: rak4631.usb.jacaudi.dev
            allocationMode: ExactCount
            count: 1
            selectors:
              - cel:
                  expression: device.attributes["usb.jacaudi.dev"].port == "PNP0D10:02-v2-1"
