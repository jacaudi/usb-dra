{{/*
Renders the bjw-s common library from the fresh values document "usb-dra.values" builds.
User values are never merged into it. fromYaml reports a parse error as an Error key
instead of failing, which would silently drop every section, so fail on it here.
*/}}
{{- $bjwsValues := include "usb-dra.values" . | fromYaml -}}
{{- if hasKey $bjwsValues "Error" }}
{{- fail (printf "usb-dra.values is not valid YAML: %s" $bjwsValues.Error) }}
{{- end -}}

{{/* Create new context with constructed values */}}
{{- $ctx := deepCopy . -}}
{{- $_ := set $ctx "Values" $bjwsValues -}}

{{ include "bjw-s.common.loader.all" $ctx }}
