{{/*
Builds a fresh values dict for the bjw-s common library and renders it. User values are
never merged into it: only the helpers below read them, so privileged, root and the host
mounts cannot be reached from values.
*/}}
{{- /* common >= 5.3.0 renders a Namespace from .Values.namespace; this dict bypasses the library defaults, so seed it. Helm owns the release namespace. */ -}}
{{- /* values.yaml is empty, so .Values.global can be absent; common needs a map there. */ -}}
{{- $bjwsValues := dict "global" (.Values.global | default dict) "namespace" (dict "create" false) -}}

{{- $_ := set $bjwsValues "controllers" (include "usb-dra.values.controllers" . | fromYaml).controllers -}}
{{- $_ := set $bjwsValues "persistence" (include "usb-dra.values.persistence" . | fromYaml).persistence -}}
{{- $_ := set $bjwsValues "serviceAccount" (include "usb-dra.values.serviceaccount" . | fromYaml).serviceAccount -}}
{{- $_ := set $bjwsValues "rbac" (include "usb-dra.values.rbac" . | fromYaml).rbac -}}

{{/* Create new context with constructed values */}}
{{- $ctx := deepCopy . -}}
{{- $_ := set $ctx "Values" $bjwsValues -}}

{{ include "bjw-s.common.loader.all" $ctx }}
