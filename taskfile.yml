# THE CI CONTRACT — generated per repo; `task ci` is what CI runs and what you run locally. Rationale: github-actions-align/templates/README.md#taskfiles
version: '3'

includes:
  repo:
    taskfile: .taskfiles/repo.yml

  # --- generated: one entry per language present; `dir:` for non-Go ---
  go:
    taskfile: .taskfiles/go.yml

  # node:
  #   taskfile: .taskfiles/node.yml
  #   dir: web
  # python:
  #   taskfile: .taskfiles/python.yml
  #   dir: renderer
  # rust:
  #   taskfile: .taskfiles/rust.yml

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list

  ci:
    desc: Everything CI runs. Run this before pushing.
    cmds:
      - task: repo:ci
      - task: go:ci
      # - task: node:ci
      # - task: python:ci
      # - task: rust:ci

  lint:
    desc: Static checks only
    cmds:
      - task: repo:ci
      - task: go:lint

  test:
    desc: Tests only
    cmds:
      - task: go:test

  build:
    desc: Build artefacts
    cmds:
      - task: go:build

  # A kubelet plugin cannot fully boot without a kubelet and an API server, so smoke
  # asserts what breaks deployment: the image runs as root (a :nonroot base dies
  # creating its socket under /var/lib/kubelet/plugins) and the binary starts.
  # Runs locally: IMAGE=ghcr.io/jacaudi/usb-dra@sha256:... task smoke
  smoke:
    desc: Assert the built image runs as root and the binary starts
    requires:
      vars: [IMAGE]
    # Accepts BOTH `IMAGE=… task smoke` and `task smoke IMAGE=…`. Without this,
    # the CLI form satisfies `requires` but leaves $IMAGE empty in the shell.
    env:
      IMAGE: '{{.IMAGE}}'
    cmds:
      - |
        set -eu
        echo "smoke testing ${IMAGE}"
        if ! docker image inspect "${IMAGE}" >/dev/null 2>&1; then docker pull --quiet "${IMAGE}" >/dev/null; fi
        user=$(docker image inspect --format '{{"{{.Config.User}}"}}' "${IMAGE}")
        case "${user}" in
          ""|0|root|0:0) echo "ok: runs as root (User='${user}')" ;;
          *) echo "::error::image runs as '${user}'; the plugin needs root"; exit 1 ;;
        esac
        out=$(docker run --rm "${IMAGE}" --help 2>&1) || { echo "${out}"; echo "::error::--help exited non-zero"; exit 1; }
        echo "${out}" | grep -q -- '-driver-name' || { echo "${out}"; echo "::error::--help printed no flag usage"; exit 1; }
        echo "ok: binary starts"

  # The release manifest uploaded to the GitHub Release by ci-artifact.yml, for
  # installs without Helm. Rendered from the chart with the release tag as the image
  # tag. Runs locally: task artifact VERSION=v0.1.0
  artifact:
    desc: Render the chart into release.yaml (the release manifest)
    requires:
      vars: [VERSION]
    # Accepts BOTH `VERSION=… task artifact` and `task artifact VERSION=…`.
    env:
      VERSION: '{{.VERSION}}'
    cmds:
      - task: repo:chart:deps
      - |
        set -eu
        {
          echo "# usb-dra ${VERSION} — install into kube-system"
          helm template usb-dra charts -n kube-system --set image.tag="${VERSION}"
        } > release.yaml
        echo "wrote release.yaml (${VERSION})"
