# Fleet baseline, tuned for Actions workflows and Helm YAML. Rationale: github-actions-align/templates/README.md#yamllintyml
extends: default

rules:
  document-start:
    present: false

  line-length: disable

  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
    check-keys: false

  comments:
    min-spaces-from-content: 1

  indentation:
    spaces: 2
    indent-sequences: true

  # Block style only for the authored chart and examples YAML. yamllint has no per-path
  # rules, but a rule-level `ignore` can scope one: ignore everything, then re-include.
  # braces permits only the empty `{}` (charts/values.yaml is exactly that).
  braces:
    forbid: non-empty
    ignore: |
      *
      !charts/Chart.yaml
      !charts/values.yaml
      !examples/*.yaml

  brackets:
    forbid: true
    ignore: |
      *
      !charts/Chart.yaml
      !charts/values.yaml
      !examples/*.yaml

  empty-lines:
    max-end: 1

ignore: |
  .worktrees/
  node_modules/
  vendor/
  charts/templates/
  charts/charts/
  # Rendered by `task artifact` (gitignored); generated output, not authored YAML.
  install.yaml
  # Helm chart templates are Go templates, not YAML — `{{- if }}` is a hard
  # syntax error to yamllint. `helm lint` + `helm template` cover them instead.
  templates/
